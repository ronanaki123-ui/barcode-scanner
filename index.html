<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソシアル製薬バーコードスキャナー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase SDK の読み込み -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased p-3 sm:p-5 max-w-xl mx-auto">

<!---------------------------------------------------------------------
ヘッダー 
---------------------------------------------------------------------->
    <header class="app-header">
        <div class="header-title-group">
            <div class="icon-box">
                <i data-lucide="camera" class="camera-icon"></i>
            </div>
            <h1 class="gradient-title">
                ソシアル製薬バーコードスキャナー
            </h1>
        </div>
        <!-- サウンド切り替え -->
        <button id="soundToggleBtn" class="sound-toggle-btn" data-enabled="true">
            <!--ON用-->
            <i data-lucide="volume-2" class="sound-icon icon-on"></i>
            <!--OFF用-->
            <i data-lucide="volumeOff" class="sound-icon icon-off"></i>
            <span id="soundLabel">音: ON</span>
        </button>
    </header>

<!---------------------------------------------------------------------
撮影プレビューエリア
---------------------------------------------------------------------->
<div class="scanner-preview-container">
    
    <!-- 撮影した画像のプレビューとキャンバス -->
    <div class="preview-content-wrapper">
        <img id="imagePreview" class="preview-image hidden" alt="撮影プレビュー">
        <video id="videoPreview" autoplay muted playsinline class="w-full h-full object-cover hidden"></video>
        <canvas id="overlayCanvas" class="preview-overlay hidden"></canvas>
    </div>

    <!-- プレビュープレースホルダー-->
    <div id="placeholderView" class="preview-placeholder">
        <div class="placeholder-icon-box">
            <i data-lucide="camera" class="placeholder-icon-size"></i>
        </div>
        <p class="placeholder-text">ボタンを押してカメラを起動し、JANコードを撮影してください</p>
    </div>

    <!-- 隠しファイル入力要素(写真撮影)-->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

    <!-- 隠しファイル入力要素(ファイル選択)-->
    <input type="file" id="photoInput" accept="image/*" class="hidden">

    <!-- 非表示解析キャンバス -->
    <canvas id="captureCanvas" class="hidden"></canvas>
</div>

<!---------------------------------------------------------------------
スキャン開始ボタン
---------------------------------------------------------------------->
    <div>
        <!--スキャン開始ボタン-->
        <div class="button-container">
            <button id="captureBtn" class="btn-camera-on">
                <i data-lucide="video" class="btn-icon"></i>
                <span id="captureBtnText">ライブビューでバーコードをスキャン</span>
            </button>
        </div>
        <div class="sub-button-container">
            <!--写真選択ボタン-->
            <div class="button-container">
                <button id="selectPhotoBtn" class="btn-photo-select">
                    <i data-lucide="image" class="btn-icon"></i>
                    <span id="selectPhotoBtnText">画像を選択してスキャン</span>
                </button>
            </div>
            <!--写真撮影ボタン-->
            <div class="button-container">
                <button id="shootPhotoBtn" class="btn-photo-shoot">
                    <i data-lucide="camera" class="btn-icon"></i>
                    <span id="shootPhotoBtnText">写真を撮影してスキャン</span>
                </button>
            </div>
        </div>
    </div>

<!---------------------------------------------------------------------
商品画像表示エリア
---------------------------------------------------------------------->
    <div id="mainImageContainer" class="main-image-container">
        <div class="main-image-content-box">
            <img id="mainImagePreview" class="main-image-preveiw hidden" alt="画像">
            <span id="mainImagePlaceholder" class="main-image-placeholder">スキャンした商品の画像が表示されます</span>
        </div>
    </div>

<!---------------------------------------------------------------------
商品情報エリア
---------------------------------------------------------------------->
    <div class="product-info-container">
        <h2 class="product-section-title">商品情報</h2>
        <dl class="product-dl">
            <div>
                <dt class="product-dt">商品名</dt>
                <dd id="productName" class="product-name">JANコードをスキャンして<br>商品を検索</dd>
            </div>
            <div class="product-info-sub">
                <div>
                    <dt class="product-sub-dt">価格</dt>
                    <dd id="productPrice" class="product-price"> - </dd>
                </div>
                <div>
                    <dt class="product-sub-dt">内容量</dt>
                    <dd id="productContent" class="product-content"> - </dd>
                </div>
                <div>
                    <dt class="product-sub-dt">在庫</dt>
                    <dd id="productStock" class="product-stock"> - </dd>
                </div>
            </div>
            <div>
                <dt class="product-dt">商品説明</dt>
                <dd id="productDescription" class="product-desc">商品の詳細がここに表示されます。</dd>
            </div>
        </dl>
    </div>

<!---------------------------------------------------------------------
統計情報エリア
---------------------------------------------------------------------->
<div class="product-info-container stats-container">
    <h2 class="product-section-title">スキャン統計</h2>
    <div id="statsContent" class="stats-content">
        <p class="stats-placeholder">データを集計中...</p>
    </div>
</div>

<!---------------------------------------------------------------------
テスト用画像出力エリア
---------------------------------------------------------------------->
    <div id="testContainer" class="test-container">
        <h2 class="test-section-title">テスト用出力画像</h2>
        <div class="test-content-box">
            <img id="testImagePreview" class="test-image hidden" alt="テスト用画像">
            <span id="testImagePlaceholder" class="test-placeholder">ここにスキャン時の画像が表示されます</span>
        </div>
    </div>

<!---------------------------------------------------------------------
その他
---------------------------------------------------------------------->
<!-- トースト通知 --> 
    <div id="toast" class="toast-notification">
        <i data-lucide="check" class="toast-icon"></i>
        <span id="toastMsg">読み取り成功！</span>
    </div>

    <!-- ライブラリ読み込み -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script> -->

    <script src="api.js"></script>
    <script src="catalog.js"></script>
    <script src="scanner.js"></script>
    <script src="app.js"></script>

</body>
</html>
