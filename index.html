<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソシアル製薬バーコードスキャナー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased p-3 sm:p-5 max-w-xl mx-auto">

<!-- ヘッダー -->
    <header class="flex items-center justify-between py-2 px-1 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="p-1.5 bg-orange-600 rounded-lg text-white">　<!--カメラアイコン-->
                <i data-lucide="camera" class="w-4 h-4"></i>
            </div>
            <h1 class="text-sm font-bold bg-gradient-to-r from-red-400 to-orange-400 bg-clip-text text-transparent">
                ソシアル製薬バーコードスキャナー
            </h1>
        </div>
        <!-- サウンド切り替え -->
        <button id="soundToggleBtn" class="flex items-center space-x-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700 transition">
            <i data-lucide="volume-2" id="soundIcon" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span id="soundLabel">音: ON</span>
        </button>
    </header>

<!-- 撮影プレビューエリア -->
    <div class="relative w-full aspect-[4/3] max-h-[36vh] bg-black rounded-2xl overflow-hidden border border-slate-700 shadow-2xl my-3">
        
        <!-- 撮影した画像のプレビューとキャンバス -->
        <div class="absolute inset-0 w-full h-full flex items-center justify-center">
            <img id="imagePreview" class="w-full h-full object-contain hidden" alt="撮影プレビュー">
            <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none object-contain hidden"></canvas>
        </div>

        <!-- プレビュープレースホルダー-->
        <div id="placeholderView" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center pointer-events-none">
            <div class="p-3 bg-orange-600/20 text-orange-400 rounded-full mb-2 border border-orange-500/30">
                <i data-lucide="camera" class="w-8 h-8"></i>
            </div>
            <p class="text-xs text-slate-300">ボタンを押してカメラを起動し、JANコードを撮影してください</p>
        </div>

        <!-- 隠しファイル入力要素 -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

        <!-- 非表示解析キャンバス -->
        <canvas id="captureCanvas" class="hidden"></canvas>
    </div>

    <!-- コントロールボタン -->
    <div class="w-full mb-3">
        <button id="captureBtn" class="w-full bg-orange-600 hover:bg-orange-500 active:scale-[0.99] text-white font-bold text-base py-3.5 px-4 rounded-xl transition shadow-lg shadow-orange-600/30 flex items-center justify-center space-x-2 border border-orange-400/30 cursor-pointer">
            <i data-lucide="camera" class="w-5 h-5"></i>
            <span id="captureBtnText">カメラを起動してJANコードをスキャン</span>
        </button>
    </div>

    <!--読み取り結果エリア-->
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 shadow-lg mb-3">
        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
            <span>スキャン結果</span>
            <span id="scanFormat" class="text-orange-400 font-mono hidden">--</span>
        </div>

        <div id="resultContent" class="bg-slate-900/90 border border-slate-700/80 rounded-lg p-2.5 min-h-[50px] flex items-center justify-between">
            <p id="resultText" class="text-slate-500 italic text-xs break-all pr-2">
                ボタンを押すとコードを読み取ります
            </p>
            
            <!-- 迅速アクションボタン-->
            <div id="resultActions" class="hidden flex items-center space-x-1 shrink-0">
                <button id="copyBtn" title="コピー" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-700 transition">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
                <a id="searchGoogleBtn" target="_blank" rel="noopener noreferrer" title="Google検索" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-blue-400 rounded border border-slate-700 transition">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- 商品名・説明 -->
    <div class="flex-1 bg-slate-800/40 border border-slate-800 rounded-xl p-4 min-h-[160px]">
        <h2 class="text-xs font-semibold text-slate-300 mb-4">商品情報</h2>
        <dl class="space-y-4">
            <div>
                <dt class="text-[11px] font-semibold text-orange-300 uppercase tracking-wider mb-1">商品名</dt>
                <dd id="productName" class="text-base font-semibold text-slate-100 break-words">JANコードをスキャンして商品を検索</dd>
            </div>
            <div>
                <dt class="text-[11px] font-semibold text-orange-300 uppercase tracking-wider mb-1">商品説明</dt>
                <dd id="productDescription" class="text-sm text-slate-300 whitespace-pre-wrap break-words">商品の詳細がここに表示されます。</dd>
            </div>
        </dl>
    </div>

    <!-- トースト通知 --> 
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-orange-600 text-white px-4 py-2 rounded-full shadow-2xl flex items-center space-x-1.5 text-xs font-medium transform translate-y-16 opacity-0 transition-all duration-200 z-50 pointer-events-none">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
        <span id="toastMsg">読み取り成功</span>
    </div>

    <!-- ライブラリ読み込み -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script> -->
    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
    <script src="app.js"></script>

</body>
</html>
